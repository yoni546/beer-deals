<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>אין חיבור</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 8px;
        text-align: center;
        padding: 24px;
        background: #17130b;
        color: #faf6ee;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      p { margin: 0; opacity: 0.7; font-size: 15px; }
      h1 { margin: 0; font-size: 20px; }
      .beer { font-size: 44px; }
    </style>
  </head>
  <body>
    <p class="beer">🍺</p>
    <h1>אין חיבור לאינטרנט</h1>
    <!-- Deliberately no cached prices here. A price shown offline is a price
         that may have expired, and this app is used standing in a shop. -->
    <p>המחירים משתנים, אז אנחנו לא שומרים אותם במכשיר. נסו שוב כשיש רשת.</p>
  </body>
</html>
