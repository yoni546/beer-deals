name: CI

# Every pull request, and every push to main, must pass all of this before it is
# safe to deploy. Nothing here needs a secret: tests run against an in-memory
# Postgres, and the end-to-end job runs the real app against a local fake
# Supabase (tests/e2e/fake-supabase). It never touches a hosted database.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Typecheck · lint · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Includes the release rule (tests/releases.test.ts), the migration tests,
      # the server/client boundary check and the component tests.
      - run: npm test
      - run: npm run changelog:check
      # The combined file is generated, not stored (see .gitignore). Building it
      # here still proves every migration concatenates.
      - run: npm run sql:build
      - name: Production build
        run: npm run build
        env:
          # Placeholders: the build only needs the variables to exist. Pages are
          # rendered per request, so nothing is fetched at build time.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3100

  e2e:
    name: End-to-end (Playwright, mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the app against the local fake Supabase
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
